services:
  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://digitaltrust:${POSTGRES_PASSWORD:-change-me}@postgres:5432/digitaltrust
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EVIDENCE_CLAMAV_HOST: clamav
      EVIDENCE_IPFS_PIN_URL: http://ipfs:5001/api/v0/add?pin=true
    ports: ["8001:8001"]
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8001
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://digitaltrust:${POSTGRES_PASSWORD:-change-me}@postgres:5432/digitaltrust
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      EVIDENCE_CLAMAV_HOST: clamav
      EVIDENCE_IPFS_PIN_URL: http://ipfs:5001/api/v0/add?pin=true
    command: celery -A backend.app.workers.tasks.celery_app worker --loglevel=INFO
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  beat:
    build: { context: ., dockerfile: backend/Dockerfile }
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    command: celery -A backend.app.workers.tasks.celery_app beat --loglevel=INFO
    depends_on: [redis]
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digitaltrust
      POSTGRES_USER: digitaltrust
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: [digitaltrust-postgres:/var/lib/postgresql/data]
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitaltrust -d digitaltrust"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [digitaltrust-redis:/data]
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  clamav:
    image: clamav/clamav:1.4
    expose: ["3310"]
    volumes: [digitaltrust-clamav:/var/lib/clamav]
    restart: unless-stopped
  ipfs:
    image: ipfs/kubo:v0.32.1
    expose: ["5001"]
    command: ["daemon", "--migrate=true", "--enable-gc"]
    volumes: [digitaltrust-ipfs:/data/ipfs]
    restart: unless-stopped
volumes:
  digitaltrust-postgres:
  digitaltrust-redis:
  digitaltrust-clamav:
  digitaltrust-ipfs:
